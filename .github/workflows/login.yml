name: Lunes Auto Login(Sweet-Node6-US)

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 23:00 = 北京时间 07:00
    - cron: "0 23 * * 1"

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LUNES_USERNAME: ${{ secrets.LUNES_USERNAME }}
      LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci || npm i
          npx playwright install --with-deps chromium          

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Run login
        run: xvfb-run --auto-servernum node scripts/login.js
        env:
          DISPLAY: :0

      - name: Archive screenshots & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-logs
          path: |
            *.png            
          if-no-files-found: ignore
